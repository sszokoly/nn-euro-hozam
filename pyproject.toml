[project]
name = "nn-euro-hozam"
version = "0.1.0"
description = "Monitors NN Euro Alap yields"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=3.0.3",
    "playwright>=1.60.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "selenium>=4.33.0",
    "streamlit>=1.57.0",
    "streamlit-lightweight-charts>=0.7.20",
    "xlrd>=2.0.1",
]

[project.scripts]
nn-euro-hozam = "nn_euro_hozam.app:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nn_euro_hozam"]


[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
