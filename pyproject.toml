[project]
name = "nn-euro-hozam"
version = "0.1.0"
description = "Monitors NN Euro Alap yields"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "log-color>=2.2.2",
    "playwright>=1.60.0",
    "pydantic>=2.0.0",
    "selenium>=4.33.0",
    "xlrd>=2.0.1",
]

[project.scripts]
nn-euro-hozam = "nn_euro_yields:main"
parse-yields = "parse_yields:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/nn_euro_yields.py", "src/parse_yields.py"]
sources = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
